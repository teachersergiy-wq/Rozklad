<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад уроків</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Розклад уроків</h1>
    <div class="controls">
      <label class="toggle-switch">
        <input type="checkbox" id="settingsModeToggle" onchange="toggleSettingsMode(this.checked)">
        Режим налаштувань
      </label>
      <button class="btn-primary" onclick="openNewLessonModal()">+ Додати урок</button>
    </div>
  </header>

  <main class="calendar-container">
    <div id="calendar" class="calendar-grid"></div>
  </main>

  <!-- Модальне вікно для створення / редагування уроку -->
  <div id="lessonModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeLessonModal()">&times;</span>
      <h3 id="modalTitle">Урок</h3>
      
      <form id="lessonForm" onsubmit="handleSaveLesson(event)">
        <input type="hidden" id="lessonId">

        <div class="form-group">
          <label for="lessonStudent">Учень:</label>
          <select id="lessonStudent" required></select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="lessonDate">Дата:</label>
            <input type="date" id="lessonDate" required>
          </div>
          <div class="form-group">
            <label for="lessonTime">Час:</label>
            <input type="time" id="lessonTime" required>
          </div>
        </div>

        <div class="form-group">
          <label for="lessonStatus">Статус уроку:</label>
          <select id="lessonStatus">
            <option value="заплановано">Заплановано</option>
            <option value="відбувся">Відбувся</option>
            <option value="скасовано">Скасовано</option>
          </select>
        </div>

        <div class="form-group">
          <label for="lessonTopic">Тема уроку:</label>
          <input type="text" id="lessonTopic" placeholder="Введіть тему уроку">
        </div>

        <div class="form-group">
          <label for="lessonHomework">Домашнє завдання:</label>
          <textarea id="lessonHomework" rows="3" placeholder="Введіть домашнє завдання"></textarea>
        </div>

        <div class="payment-group">
          <label class="checkbox-label">
            <input type="checkbox" id="lessonIsPaid" onchange="togglePaymentDetails(this.checked)">
            Оплачено
          </label>

          <div id="paymentDetails" style="display: none;" class="payment-details">
            <div class="form-group">
              <label for="lessonPaymentAmount">Сума (грн):</label>
              <input type="number" id="lessonPaymentAmount" value="175">
            </div>

            <div class="form-group">
              <label for="lessonPaymentDate">Дата оплати:</label>
              <input type="date" id="lessonPaymentDate">
            </div>

            <div class="form-group">
              <label for="lessonPaymentMethod">Спосіб оплати:</label>
              <select id="lessonPaymentMethod">
                <option value="МоноБанк" selected>МоноБанк</option>
                <option value="ПриватБанк">ПриватБанк</option>
                <option value="Готівка">Готівка</option>
                <option value="Інше">Інше</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="submit" id="saveLessonBtn" class="btn-primary">Зберегти</button>
          <span id="deleteLessonContainer"></span>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
